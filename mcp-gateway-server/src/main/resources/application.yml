server:
  port: ${MCP_GATEWAY_PORT:8080}

spring:
  application:
    name: mcp-gateway-server
  datasource:
    url: ${GATEWAY_DATABASE_URL:jdbc:mysql://127.0.0.1:3306/mcp_gateway?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${GATEWAY_DATABASE_USERNAME:mcp_gateway}
    password: ${GATEWAY_DATABASE_PASSWORD:}
  sql:
    init:
      mode: never

gateway:
  nacos:
    server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
    namespace: ${NACOS_NAMESPACE:mcp-gateway-demo}
    group: ${NACOS_GROUP:DEFAULT_GROUP}
  openapi:
    timeout: ${GATEWAY_OPENAPI_TIMEOUT:PT5S}
  validation:
    # 环境变量提供启动默认值；Nacos 的 gateway.validation 配置存在时优先覆盖。API Key 仅由服务端环境变量提供。
    nacos-data-id: ${GATEWAY_VALIDATION_NACOS_DATA_ID:mcp-gateway-server.yaml}
    model: ${GATEWAY_VALIDATION_MODEL:deepseek-v4-flash}
    base-url: ${GATEWAY_VALIDATION_BASE_URL:https://api.deepseek.com}
    mcp-endpoint: ${GATEWAY_VALIDATION_MCP_ENDPOINT:http://127.0.0.1:${server.port}/mcp}

management:
  endpoints:
    web:
      exposure:
        include: health,info
