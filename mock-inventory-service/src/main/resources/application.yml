server:
  port: ${MOCK_INVENTORY_SERVICE_PORT:8084}
spring:
  application:
    name: mock-inventory-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
springdoc:
  api-docs:
    path: /v3/api-docs
mock:
  inventory:
    slow-response-delay: ${MOCK_INVENTORY_SLOW_RESPONSE_DELAY:PT16S}
