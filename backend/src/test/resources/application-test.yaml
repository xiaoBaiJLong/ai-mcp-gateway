spring:
  datasource:
    url: jdbc:h2:mem:mcp_gateway;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  data:
    redis:
      repositories:
        enabled: false

gateway:
  nacos:
    enabled: false

management:
  health:
    redis:
      enabled: false
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db
