spring:
  application:
    name: ai-mcp-gateway
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/mcp_gateway?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:mcp_gateway}
    password: ${MYSQL_PASSWORD:mcp_gateway}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax

gateway:
  nacos:
    enabled: true
    server-address: ${NACOS_SERVER_ADDRESS:localhost:8848}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,redis,nacos
