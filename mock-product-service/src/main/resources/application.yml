server:
  port: ${MOCK_PRODUCT_SERVICE_PORT:8083}
spring:
  application:
    name: mock-product-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
springdoc:
  api-docs:
    path: /v3/api-docs
mock:
  product:
    slow-response-delay: ${MOCK_PRODUCT_SLOW_RESPONSE_DELAY:PT16S}
