server:
  port: ${MOCK_PAYMENT_SERVICE_PORT:8085}
spring:
  application:
    name: mock-payment-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
springdoc:
  api-docs:
    path: /v3/api-docs
mock:
  payment:
    slow-response-delay: ${MOCK_PAYMENT_SLOW_RESPONSE_DELAY:PT16S}
