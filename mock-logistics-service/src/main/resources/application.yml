server:
  port: ${MOCK_LOGISTICS_SERVICE_PORT:8086}
spring:
  application:
    name: mock-logistics-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE}
        group: ${NACOS_GROUP}
springdoc:
  api-docs:
    path: /v3/api-docs
mock:
  logistics:
    slow-response-delay: ${MOCK_LOGISTICS_SLOW_RESPONSE_DELAY:PT16S}
